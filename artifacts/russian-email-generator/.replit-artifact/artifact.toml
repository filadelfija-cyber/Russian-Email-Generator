kind = "mobile"
previewPath = "/"
title = "Russian Email Generator"
description = "A simple offline Android app that generates sample email addresses using popular email domains and common Russian surnames, with copy and refresh actions."
version = "1.0.0"
id = "artifacts/russian-email-generator"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25022

[services.development]
run = "pnpm --filter @workspace/russian-email-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/russian-email-generator", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/russian-email-generator", "run", "serve" ]

[services.env]
PORT = "25022"
BASE_PATH = "/"
