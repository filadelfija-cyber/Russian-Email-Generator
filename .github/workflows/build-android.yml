name: Build Android Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_DOMAIN: example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: artifacts/russian-email-generator
        env:
          CI: true
        run: pnpm exec expo install --check

      - name: Build workspace TypeScript libraries
        run: pnpm run typecheck:libs

      - name: Type-check mobile app
        run: pnpm --filter @workspace/russian-email-generator run typecheck

      - name: Validate Android JavaScript bundle
        working-directory: artifacts/russian-email-generator
        env:
          CI: true
        run: pnpm exec expo export --platform android --output-dir /tmp/russian-email-generator-export --clear

      - name: Generate clean Android native project
        working-directory: artifacts/russian-email-generator
        env:
          CI: true
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build release APK and AAB
        working-directory: artifacts/russian-email-generator/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify release artifacts
        working-directory: artifacts/russian-email-generator/android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: russian-email-generator-android-release
          path: |
            artifacts/russian-email-generator/android/app/build/outputs/bundle/release/app-release.aab
            artifacts/russian-email-generator/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
