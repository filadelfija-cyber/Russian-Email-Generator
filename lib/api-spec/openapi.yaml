openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: email
    description: Email delivery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /email/send:
    post:
      operationId: sendEmail
      tags: [email]
      summary: Send an email to generated recipients
      description: Sends one email to the supplied recipients using the provided SMTP settings. SMTP credentials are used only for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailRequest"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendResult"
        "400":
          description: Invalid email request
        "502":
          description: SMTP delivery failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SmtpSettings:
      type: object
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: number
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
        secure:
          type: boolean
        fromEmail:
          type: string
          maxLength: 320
      required:
        - host
        - port
        - username
        - password
        - secure
        - fromEmail
    SendEmailRequest:
      type: object
      properties:
        smtp:
          $ref: "#/components/schemas/SmtpSettings"
        recipients:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
        subject:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
          maxLength: 100000
      required:
        - smtp
        - recipients
        - subject
        - body
    EmailSendResult:
      type: object
      properties:
        sent:
          type: number
        messageId:
          type: string
      required:
        - sent
        - messageId

